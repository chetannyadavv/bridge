services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: bridge
    ports:
      - "5433:5432"
    volumes:
      - bridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./bridge-backend
    environment:
      BRIDGE_DATABASE_URL: postgresql+psycopg2://bridge:bridge@db:5432/bridge
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bridge_pgdata:
